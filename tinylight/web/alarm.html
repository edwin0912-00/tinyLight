<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alarm">
<meta name="theme-color" content="#000000">
<title>Alarm</title>
<link rel="manifest" href="alarm.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Bedside night mode: black, dim amber, nothing that lights up a dark room. */
  :root { --amber:255,159,67; --dawn:0; --glow:255,170,90; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; background:#000; color:rgba(var(--amber),.55); overflow:hidden;
              font-family:-apple-system,"SF Pro Display",system-ui,sans-serif; }
  body { background:radial-gradient(130% 80% at 50% 110%, rgba(var(--glow),calc(var(--dawn)*.9)), transparent 70%), #000;
         transition:background 2s linear; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
            padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  .screen.on { display:flex; }

  /* start */
  #start h1 { font-weight:300; font-size:30px; color:#f2e6d8; margin:0 0 10px; letter-spacing:.2px; }
  #start p { color:#8b8178; text-align:center; max-width:320px; line-height:1.45; margin:0 0 28px; font-size:16px; }
  #go { border:0; border-radius:999px; padding:20px 34px; font-size:19px; font-weight:600; color:#1a0f04;
        background:rgb(var(--amber)); box-shadow:0 0 40px rgba(var(--amber),.35); }
  #go:active { transform:scale(.97); }
  #start .hint { margin-top:22px; font-size:13px; color:#6b625b; max-width:300px; text-align:center; }

  /* night */
  #clock { white-space:nowrap; font-size:min(30vw,170px); font-weight:200; letter-spacing:-2px; font-variant-numeric:tabular-nums;
           color:rgba(var(--amber),calc(.28 + var(--dawn)*.6)); transition:transform 60s linear, color 2s; line-height:1; }
  #sub { margin-top:14px; font-size:15px; color:rgba(var(--amber),.32); text-align:center; line-height:1.5; }
  #status { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 18px); left:0; right:0; display:flex;
            justify-content:center; gap:16px; font-size:12px; color:rgba(var(--amber),.28); }
  #status span::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px;
                         vertical-align:1px; background:#5a2f12; }
  #status span.ok::before { background:#3c8a4c; }
  #tools { position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:0; right:0; display:flex; justify-content:center;
           gap:10px; opacity:0; pointer-events:none; transition:opacity .4s; }
  #tools.show { opacity:1; pointer-events:auto; }
  #tools button { background:#151210; color:#b59a80; border:1px solid #2a2219; border-radius:999px; padding:10px 15px; font-size:14px; }

  /* ringing */
  #ring { background:radial-gradient(120% 90% at 50% 100%, rgba(var(--glow),.95), rgba(var(--glow),.25) 60%, #120a04); color:#1a0f04; }
  #ring .t { font-size:min(24vw,130px); font-weight:300; font-variant-numeric:tabular-nums; color:#fff4e8;
             text-shadow:0 0 40px rgba(255,200,140,.6); }
  #ring .n { color:#fff4e8; opacity:.85; margin:6px 0 34px; font-size:17px; }
  #stop { width:min(78vw,340px); height:min(78vw,340px); border-radius:50%; border:0; font-size:34px; font-weight:700;
          color:#1a0f04; background:#fff4e8; box-shadow:0 0 0 14px rgba(255,244,232,.18), 0 0 80px rgba(255,220,180,.8);
          animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow:0 0 0 26px rgba(255,244,232,.08), 0 0 120px rgba(255,220,180,.95); } }
  #stop:active { transform:scale(.96); }
  #snooze { margin-top:30px; background:rgba(0,0,0,.25); color:#fff4e8; border:1px solid rgba(255,244,232,.4);
            border-radius:999px; padding:16px 30px; font-size:18px; }
  @media (prefers-reduced-motion: reduce) { #stop { animation:none; } #clock { transition:none; } }
</style>
</head>
<body>

<section class="screen on" id="start">
  <h1>Night mode</h1>
  <p>Put the phone on the charger by your bed. The screen stays on, very dim, so the alarm always rings here too.</p>
  <button id="go">Start night mode</button>
  <div class="hint" id="hint">Uses sound and keeps the screen awake. Tap the clock later for options; hold it to leave.</div>
</section>

<section class="screen" id="night">
  <div id="tools">
    <button id="test">Test 45 s</button>
    <button id="ping">Ping Macs</button>
    <button id="exit">Leave</button>
  </div>
  <div id="clock">--:--</div>
  <div id="sub">Connecting…</div>
  <div id="status"><span id="s-link">bridge</span><span id="s-sound">sound</span><span id="s-screen">screen on</span></div>
</section>

<section class="screen" id="ring">
  <div class="t" id="rclock">--:--</div>
  <div class="n" id="rname">Good morning</div>
  <button id="stop">Stop</button>
  <button id="snooze">Snooze 9 min</button>
</section>

<script>
const tok = new URLSearchParams(location.search).get("token") || "";
const q = (p, extra = {}) => p + "?" + new URLSearchParams({ ...extra, ...(tok ? { token: tok } : {}) });
const $ = id => document.getElementById(id);
const ME = "Phone (bedside)";
const api = (p, x) => fetch(q(p, x)).then(r => r.json()).catch(() => null);
let ctx = null, keep = null, lock = null, serverOffset = 0, dev = { offset_ms: 0, gain: 1 }, alarmEv = { state: "idle" };
const serverNow = () => Date.now() / 1000 + serverOffset;
const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
const hhmm = d => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });

// --- start: one tap unlocks audio and asks to keep the screen on ------------------------------
function silentWav(seconds) {
  const sr = 8000, n = sr * seconds, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}

async function wake() {
  try {
    lock = await navigator.wakeLock.request("screen");
    lock.addEventListener("release", () => mark("s-screen", false));
    mark("s-screen", true);
  } catch (e) {
    mark("s-screen", false);
    $("sub").innerHTML = "Screen may sleep. Settings → Display &amp; Brightness → Auto-Lock → Never.";
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("night").classList.contains("on")) { wake(); ctx && ctx.resume(); } });

$("go").onclick = async () => {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const b = ctx.createBufferSource(); b.buffer = ctx.createBuffer(1, 1, 22050); b.connect(ctx.destination); b.start();
  keep = keep || Object.assign(new Audio(silentWav(2)), { loop: true });
  try { await keep.play(); } catch (e) {}
  mark("s-sound", ctx.state === "running");
  await wake();
  localStorage.setItem("tl_night", "1");
  show(alarmEv.state === "ringing" || alarmEv.state === "snoozed" ? "ring" : "night");
  sync(); stream(); loadNext();
};

function mark(id, ok) { $(id).classList.toggle("ok", !!ok); }

// --- clock: dim, drifts a few pixels every minute against burn-in ------------------------------
function tick() {
  const n = new Date();
  $("clock").textContent = $("rclock").textContent = hhmm(n);
  if (n.getSeconds() === 0) $("clock").style.transform = `translate(${(Math.random() - .5) * 40}px, ${(Math.random() - .5) * 60}px)`;
}
setInterval(tick, 1000); tick();

let toolsT;
$("clock").addEventListener("click", () => { $("tools").classList.add("show"); clearTimeout(toolsT); toolsT = setTimeout(() => $("tools").classList.remove("show"), 6000); });
let holdT;
$("clock").addEventListener("touchstart", () => { holdT = setTimeout(leave, 1200); });
$("clock").addEventListener("touchend", () => clearTimeout(holdT));
$("exit").onclick = leave;
function leave() { lock && lock.release(); lock = null; show("start"); localStorage.removeItem("tl_night"); }
$("test").onclick = () => api("/alarm/test", { mode: "gentle", seconds: 45 });
$("ping").onclick = () => api("/ping");

// --- bridge: clock sync, next alarm, live events -----------------------------------------------
async function sync() {
  let best = null;
  for (let i = 0; i < 8; i++) {
    const t0 = Date.now() / 1000, j = await api("/time"), t1 = Date.now() / 1000;
    if (j && (!best || t1 - t0 < best.rtt)) best = { rtt: t1 - t0, off: j.t - (t0 + t1) / 2 };
  }
  if (best) serverOffset = best.off;
  const d = await api("/devices");
  if (d && d[ME]) dev = { offset_ms: d[ME].offset_ms || 0, gain: d[ME].gain || 1 };
}
setInterval(sync, 120000);

async function loadNext() {
  const a = await api("/alarms");
  if (!a) { $("sub").textContent = "Bridge not reachable"; return; }
  const on = (a.alarms || []).filter(x => x.enabled !== false);
  const nx = (a.next || []).filter(x => x.next).map(x => ({ ...x, d: new Date(x.next) })).sort((x, y) => x.d - y.d)[0];
  if (!nx) { $("sub").textContent = on.length ? "Alarm is off for the coming days" : "No alarm set"; return; }
  const al = on.find(x => x.id === nx.id) || {}, mode = (a.modes[al.mode] || {}).name || "";
  const left = Math.max(0, nx.d - Date.now()), h = Math.floor(left / 3.6e6), m = Math.round((left % 3.6e6) / 6e4);
  $("sub").innerHTML = `${nx.d.toLocaleDateString([], { weekday: "short" })} ${hhmm(nx.d)} · ${mode}<br>in ${h} h ${m} min`;
}
setInterval(loadNext, 60000);

function stream() {
  const es = new EventSource(q("/events", { device: ME }));
  es.onopen = () => mark("s-link", true);
  es.onerror = () => mark("s-link", false);
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.type === "alarm") onAlarm(e);
    if (e.type === "state") onLight(e.state);
    if (e.type === "ping" && (e.device === "all" || e.device === ME)) chime(e.volume || .8);
  };
}

// Dawn: the phone screen warms up with the lamp (only while an alarm runs).
function kelvinRGB(k) {
  const t = k / 100;
  const r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
  const g = t <= 66 ? 99.47 * Math.log(t) - 161.12 : 288.12 * Math.pow(t - 60, -0.0755);
  const b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04);
  return [r, g, b].map(v => Math.round(Math.min(255, Math.max(0, v)))).join(",");
}
function onLight(s) {
  if (alarmEv.state !== "dawn") return;
  const lvl = s.on ? (s.brightness || 0) / 100 : 0;
  document.documentElement.style.setProperty("--dawn", Math.min(1, lvl * 1.4).toFixed(3));
  document.documentElement.style.setProperty("--glow", s.mode === "hsi" ? "255,120,40" : kelvinRGB(s.cct || 3000));
}

function onAlarm(e) {
  alarmEv = e;
  const night = $("start").classList.contains("on") ? null : true;
  if (e.state === "ringing" || e.state === "snoozed") {
    $("rname").textContent = e.state === "snoozed" ? "Snoozed · tap Stop to end" : (e.name || "Good morning");
    $("snooze").style.display = e.state === "snoozed" ? "none" : "inline-block";
    if (night) show("ring");
    if (navigator.vibrate && e.state === "ringing") navigator.vibrate([400, 200, 400]);
  } else {
    if (night) show("night");
    if (e.state === "idle") document.documentElement.style.setProperty("--dawn", 0);
    loadNext();
  }
  player.update(e);
}
$("stop").onclick = () => api("/alarm/stop");
$("snooze").onclick = () => api("/alarm/snooze");

// --- sound: same clock, curve and easing as the Macs (tinylight/alarm.py) ----------------------
function bezier(p, x1, x2) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 30; i++) { const t = (lo + hi) / 2, x = 3 * (1 - t) ** 2 * t * x1 + 3 * (1 - t) * t * t * x2 + t ** 3; if (x < p) lo = t; else hi = t; }
  const t = (lo + hi) / 2; return 3 * (1 - t) * t * t + t ** 3;
}
function curveAt(pts, x) {
  const s = [...pts].sort((a, b) => a.t - b.t);
  if (!s.length || x < s[0].t) return null;
  for (let i = 0; i < s.length - 1; i++) {
    const a = s[i], b = s[i + 1];
    if (a.t <= x && x < b.t) {
      const p = (x - a.t) / (b.t - a.t);
      return a.volume + (b.volume - a.volume) * (a.hold ? 0 : bezier(p, (a.ease_out ?? 50) / 100, 1 - (b.ease_in ?? 50) / 100));
    }
  }
  return s[s.length - 1].volume;
}
const buffers = {};
async function sound(name) {
  if (!buffers[name]) buffers[name] = await ctx.decodeAudioData(await (await fetch(q(`/sounds/${encodeURIComponent(name)}.m4a`))).arrayBuffer());
  return buffers[name];
}
const player = {
  ev: null, src: null, gain: null, name: null, timer: null,
  update(e) {
    if (!["dawn", "ringing", "snoozed"].includes(e.state) || !(e.sound_points || []).length || !ctx) { this.stop(); return; }
    if (this.ev && this.ev.key !== e.key) this.stop();
    this.ev = e;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 100);
  },
  async tick() {
    const e = this.ev; if (!e) return;
    const now = serverNow() + (ctx.outputLatency || ctx.baseLatency || 0) - dev.offset_ms / 1000;
    const x = (now - e.T) / 60 * (e.scale || 1);
    let v = e.state === "snoozed" ? null : curveAt(e.sound_points, x);
    if (v !== null && e.resume_at) v *= Math.min(1, Math.max(0, (now - e.resume_at) / 30));
    let name = e.sound;
    [...e.sound_points].sort((a, b) => a.t - b.t).forEach(p => { if (p.t <= x && p.sound) name = p.sound; });
    if (v !== null && name !== this.name) {
      this.name = name;
      const buf = await sound(name);
      if (this.src) this.src.stop();
      this.gain = ctx.createGain(); this.gain.gain.value = 0; this.gain.connect(ctx.destination);
      this.src = ctx.createBufferSource(); this.src.buffer = buf; this.src.loop = true; this.src.connect(this.gain);
      const pts = e.sound_points.filter(p => p.sound === name).map(p => p.t);
      const startX = pts.length ? Math.min(...pts) : Math.min(...e.sound_points.map(p => p.t));
      this.src.start(0, Math.max(0, (x - startX) * 60 / (e.scale || 1)) % buf.duration);
    }
    if (this.gain) this.gain.gain.setTargetAtTime(v === null ? 0 : Math.min(1, (v / 100) ** 2 * dev.gain), ctx.currentTime, 0.05);
  },
  stop() {
    clearInterval(this.timer); this.timer = null; this.ev = null; this.name = null;
    if (this.gain) { this.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); const s = this.src; setTimeout(() => s && s.stop(), 600); }
    this.src = null; this.gain = null;
  },
};
function chime(volume) {
  if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
  if (!ctx) return;
  [[880, 0], [1320, .18]].forEach(([f, d]) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + d;
    o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(volume * .6, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 1.2);
    o.start(t); o.stop(t + 1.3);
  });
}

if (!("wakeLock" in navigator)) $("hint").textContent = "This browser cannot keep the screen on by itself: set Auto-Lock to Never while you sleep.";
if (localStorage.getItem("tl_night")) $("go").textContent = "Resume night mode";
</script>
</body>
</html>
